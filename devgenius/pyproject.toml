[project]
name = "devgenius"
version = "0.1.0"
description = "Agente de Arquitectura AWS potenciado por Bedrock y orquestado con LangGraph (CLI)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.7",
    "langchain-aws>=0.2.0",
    "langgraph>=0.2.0",
    "requests>=2.32.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
devgenius = "chatbot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["chatbot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
